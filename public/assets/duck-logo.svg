<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f7ad6" />
      <stop offset="100%" stop-color="#134a85" />
    </linearGradient>
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cyber Duck Head -->
  <path d="M 25 65 C 20 45, 30 20, 55 20 C 75 20, 85 35, 80 50 C 78 55, 75 60, 68 62 L 68 62 C 60 62, 58 55, 52 55 C 45 55, 42 65, 35 68 Z" fill="url(#duckGrad)" stroke="#7effa4" stroke-width="2.5" />
  <!-- Beak -->
  <path d="M 68 45 L 94 48 C 98 49, 98 55, 92 58 L 68 58 Z" fill="#ff8a3d" stroke="#f5b35a" stroke-width="1.5" />
  <!-- Cyber Eye -->
  <circle cx="50" cy="38" r="6" fill="#05080f" stroke="#7effa4" stroke-width="2" />
  <circle cx="51" cy="37" r="2.5" fill="#7effa4" filter="url(#mintGlow)" />
  <!-- Visor detail line -->
  <path d="M 36 34 Q 50 28 64 36" fill="none" stroke="#67e4ff" stroke-width="2" stroke-linecap="round" />
